<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Drive & Gas Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar for Inputs & Results -->
        <aside class="sidebar">
            <header>
                <div id="palette-selector" class="palette-container">
                    <button class="palette-btn" data-palette="0">1</button>
                    <button class="palette-btn" data-palette="1">2</button>
                    <button class="palette-btn" data-palette="2">3</button>
                    <button class="palette-btn" data-palette="3">4</button>
                </div>
                <h1>Tour Router</h1>
            </header>

            <section class="config-section">
                <h2>Vehicle & Fuel</h2>
                <div class="input-group">
                    <label for="mpg">Vehicle MPG:</label>
                    <input type="number" id="mpg" value="10" min="1" step="0.1" placeholder="e.g. 10">
                </div>
                <div class="input-group">
                    <label for="gas-price">Gas Price ($/gal):</label>
                    <input type="number" id="gas-price" value="3.50" min="0.01" step="0.01" placeholder="e.g. 3.50">
                </div>
                <div class="input-group">
                    <label for="tour-days">Days on tour:</label>
                    <input type="number" id="tour-days" min="1" step="1" placeholder="e.g. 14">
                </div>
                <div class="input-group">
                    <label for="lodging-price">Average lodging price ($/night):</label>
                    <input type="number" id="lodging-price" min="0" step="0.01" placeholder="e.g. 100">
                </div>
                <div class="input-group">
                    <label for="crew-count">Number of crew:</label>
                    <input type="number" id="crew-count" min="1" step="1" placeholder="e.g. 3">
                </div>
                <div class="input-group">
                    <label for="crew-rate">Crew day rate ($/day):</label>
                    <input type="number" id="crew-rate" min="0" step="0.01" placeholder="e.g. 150">
                </div>
            </section>

            <section class="itinerary-section">
                <h2>Itinerary</h2>
                <div id="stops-container">
                    <!-- Stops will be added here dynamically by JS -->
                </div>
                <div class="itinerary-actions">
                    <button id="add-stop-btn">+ Add Stop</button>
                    <button id="calculate-btn" class="primary-btn">Calculate Route</button>
                </div>
            </section>

            <section class="results-section">
                <h2>Results</h2>
                <div id="error-message" class="error-message hidden"></div>

                <div class="summary-card">
                    <p><strong>Total Distance:</strong> <span id="total-distance">0 mi</span></p>
                    <p><strong>Total Time:</strong> <span id="total-time">0 min</span></p>
                    <p><strong>Est. Gas Cost:</strong> <span id="total-cost">$0.00</span></p>
                    <p><strong>Est. Lodging Cost:</strong> <span id="lodging-cost">$0.00</span></p>
                    <p><strong>Est. Crew Cost:</strong> <span id="crew-cost">$0.00</span></p>
                    <p><strong>Grand Total:</strong> <span id="grand-total">$0.00</span></p>
                </div>

                <h3>Leg Breakdown</h3>
                <ul id="legs-breakdown" class="legs-list">
                    <!-- Leg details injected here -->
                </ul>
                <button id="download-pdf-btn" class="primary-btn hidden" style="margin-top: 15px;">Download PDF</button>
            </section>
        </aside>

        <!-- Main Map Area -->
        <main class="map-container">
            <div id="map"></div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="app.js"></script>
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&libraries=places&callback=initMap"></script>
</body>
</html>
